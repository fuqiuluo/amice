name: Linux/macOS Build For Android NDK

on:
  push:
    branches: [ master ]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/build.rs'
      - 'crates/**/cpp/**'
      - 'crates/amice/tests/c/fixtures/android_ndk/**'
      - 'scripts/**'
      - '.github/actions/setup-ndk-clang/**'
      - 'rust-toolchain*'
      - '.github/workflows/build-android-ndk.yml'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [ master ]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/build.rs'
      - 'crates/**/cpp/**'
      - 'crates/amice/tests/c/fixtures/android_ndk/**'
      - 'scripts/**'
      - '.github/actions/setup-ndk-clang/**'
      - 'rust-toolchain*'
      - '.github/workflows/build-android-ndk.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: "LLVM/OPT ${{ matrix.llvm-version[0] }} ${{ matrix.os }} For Android NDK ${{ matrix.llvm-version[3] }}"
    strategy:
      fail-fast: false
      matrix:
        llvm-version:
#          - ["14", "14-0", "140", "r25c", "r450784d1"]
#          - ["17", "17-0", "170", "r26d", "r487747e"]
          - ["18", "18-1", "181", "r27d", "r522817d"]
          - ["19", "19-1", "191", "r28c", "r530567e"]
          - ["21", "21-1", "211", "r29", "r563880c"]
          - ["21", "21-1", "211", "r30", "r574158c"]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      BUILD_OUTPUT_PATH: target/release
    
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Cache Rust Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-llvm${{ matrix.llvm-version[0] }}-${{ hashFiles('**/Cargo.lock') }}-android-ndk-${{ matrix.llvm-version[3] }}
          restore-keys: ${{ runner.os }}-cargo-llvm${{ matrix.llvm-version[0] }}-${{ hashFiles('**/Cargo.lock') }}-android-ndk-${{ matrix.llvm-version[3] }}

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.89.0'

      - name: Install Android NDK Clang
        id: ndk-clang
        uses: ./.github/actions/setup-ndk-clang
        with:
          ndk-version: ${{ matrix.llvm-version[3] }}

      - name: Install LLVM and Clang
        run: |
          set -euxo pipefail

          env_name="LLVM_SYS_${{ matrix.llvm-version[2] }}_PREFIX"
          echo "${env_name}=${{ steps.ndk-clang.outputs.clang-path }}" >> "$GITHUB_ENV"
          echo "${{ steps.ndk-clang.outputs.clang-path }}/bin" >> "$GITHUB_PATH"
          LLVM_HOME="${{ steps.ndk-clang.outputs.clang-path }}"
          echo "LLVM_HOME=${LLVM_HOME}" >> "$GITHUB_ENV"

          if [ "${RUNNER_OS}" = "Linux" ]; then
            HOST_DIR="linux-x86"
            LIB_EXT="so"
          else
            # macOS runners can be x86_64 (macos-13) or arm64 (macos-14)
            HOST_DIR="darwin-x86"
            LIB_EXT="dylib"
          fi

          # Prefer lib64 if present, otherwise use lib
          if [ -d "${LLVM_HOME}/lib64" ]; then
            LIBDIR="${LLVM_HOME}/lib64"
          else
            LIBDIR="${LLVM_HOME}/lib"
          fi
          echo "LLVM_LIBDIR=${LIBDIR}" >> "$GITHUB_ENV"

          # Compiler env
          echo "CC=${LLVM_HOME}/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=${LLVM_HOME}/bin/clang++" >> "$GITHUB_ENV"

          # OS-specific library search env to avoid DYLD conflicts on macOS
          if [ "${RUNNER_OS}" = "Linux" ]; then
            echo "LD_LIBRARY_PATH=${LIBDIR}" >> "$GITHUB_ENV"
            echo "CXXFLAGS=-stdlib=libc++ -I${LLVM_HOME}/include/c++/v1" >> "$GITHUB_ENV"
            echo "LDFLAGS=-stdlib=libc++ -L${LIBDIR}" >> "$GITHUB_ENV"
          else
            # Do NOT export DYLD_LIBRARY_PATH to avoid overriding system libc++/c++abi
            # Inject rpath for produced artifacts to locate libLLVM at runtime
            echo "RUSTFLAGS=-C link-args=-Wl,-rpath,${LIBDIR}" >> "$GITHUB_ENV"
            # Use macOS SDK with NDK clang so standard headers are found
            SDKROOT=$(xcrun --sdk macosx --show-sdk-path)
            echo "SDKROOT=${SDKROOT}" >> "$GITHUB_ENV"
            echo "CFLAGS=-isysroot ${SDKROOT}" >> "$GITHUB_ENV"
            echo "CXXFLAGS=-isysroot ${SDKROOT} -stdlib=libc++ -I${LLVM_HOME}/include/c++/v1" >> "$GITHUB_ENV"
            # Baseline deployment target
            echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
          fi

          # Discover actual libLLVM filename and create a generic symlink under ${LIBDIR}
          if [ "${LIB_EXT}" = "so" ]; then
            if [ ! -e "${LIBDIR}/libLLVM.so" ]; then
              ls -al "${LIBDIR}" || true
              CANDIDATE=$( (ls "${LIBDIR}"/libLLVM*.so* 2>/dev/null || true) | head -n 1 || true)
              if [ -n "$CANDIDATE" ]; then
                ln -s "$CANDIDATE" "${LIBDIR}/libLLVM.so" 2>/dev/null || true
              fi
            fi
          else
            if [ ! -e "${LIBDIR}/libLLVM.dylib" ]; then
              ls -al "${LIBDIR}" || true
              CANDIDATE=$( (ls "${LIBDIR}"/libLLVM*.dylib* 2>/dev/null || true) | head -n 1 || true)
              if [ -n "$CANDIDATE" ]; then
                ln -s "$CANDIDATE" "${LIBDIR}/libLLVM.dylib" || true
              fi
            fi
          fi

      - name: Build libamice (Release)
        run: |
          set -euxo pipefail
          cargo build --release --no-default-features --features llvm${{ matrix.llvm-version[1] }},android-ndk
          
          # Determine extension by OS
          if [ "${RUNNER_OS}" = "macOS" ]; then EXT="dylib"; else EXT="so"; fi

          # Verify the built library exists
          if [ ! -f "${{ env.BUILD_OUTPUT_PATH }}/libamice.${EXT}" ]; then
            echo "Error: libamice.${EXT} not found in expected location"
            ls -la "${{ env.BUILD_OUTPUT_PATH }}/"
            exit 1
          fi

          # Show library info
          file "${{ env.BUILD_OUTPUT_PATH }}/libamice.${EXT}"
          if [ "${RUNNER_OS}" = "macOS" ]; then
            otool -L "${{ env.BUILD_OUTPUT_PATH }}/libamice.${EXT}" || true
          else
            ldd "${{ env.BUILD_OUTPUT_PATH }}/libamice.${EXT}" || true
          fi

      - name: Test bundle packaging and wrappers
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Install Android NDK for bundle tests
        if: matrix.llvm-version[3] == 'r29' || matrix.llvm-version[3] == 'r30'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ matrix.llvm-version[3] }}
          add-to-path: false

      - name: Package and test Android NDK bundle
        if: matrix.llvm-version[3] == 'r29' || matrix.llvm-version[3] == 'r30'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == macOS ]]; then
            host_tag=darwin-x86_64
            extension=dylib
          else
            host_tag=linux-x86_64
            extension=so
          fi
          scripts/package_android_ndk_bundle.sh \
            --ndk-home "${{ steps.setup-ndk.outputs.ndk-path }}" \
            --llvm-home "$LLVM_HOME" \
            --plugin "$BUILD_OUTPUT_PATH/libamice.$extension" \
            --ndk-release "${{ matrix.llvm-version[3] }}" \
            --llvm-feature "llvm${{ matrix.llvm-version[1] }}" \
            --clang-revision "${{ matrix.llvm-version[4] }}" \
            --host-tag "$host_tag" --out-dir "$RUNNER_TEMP/ndk-dist"
          # Extract into a path with spaces to exercise relocation and quoting.
          extracted="$RUNNER_TEMP/ndk bundle test"
          mkdir -p "$extracted"
          tar -xzf "$RUNNER_TEMP/ndk-dist/amice-android-ndk-${{ matrix.llvm-version[3] }}-$host_tag.tar.gz" -C "$extracted"
          python3 scripts/test_android_ndk_bundle.py \
            --bundle "$extracted/amice-android-ndk-${{ matrix.llvm-version[3] }}-$host_tag" \
            --ndk-release "${{ matrix.llvm-version[3] }}" \
            --clang-revision "${{ matrix.llvm-version[4] }}" \
            --output-dir "$RUNNER_TEMP/android-test-binaries"

      - name: Upload r30 runtime fixtures
        if: runner.os == 'Linux' && matrix.llvm-version[3] == 'r30'
        uses: actions/upload-artifact@v4
        with:
          name: ndk-r30-runtime-tests
          path: ${{ runner.temp }}/android-test-binaries/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Build Artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: libamice-linux-x64-android-ndk-${{ matrix.llvm-version[3] }}
          path: ${{ env.BUILD_OUTPUT_PATH }}/libamice.so
          retention-days: 30
          if-no-files-found: error

      - name: Upload Build Artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: libamice-macos-x64-android-ndk-${{ matrix.llvm-version[3] }}
          path: ${{ env.BUILD_OUTPUT_PATH }}/libamice.dylib
          retention-days: 30
          if-no-files-found: error

  android-runtime:
    name: Run NDK r30 fixtures on Android
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ndk-r30-runtime-tests
          path: android-test-binaries
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify runtime behavior on Android x86_64
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: python3 scripts/test_android_ndk_bundle.py --runtime-only --output-dir android-test-binaries --adb-serial emulator-5554 --abi x86_64
